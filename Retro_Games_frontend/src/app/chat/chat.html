<div class="container-fluid d-flex flex-column justify-content-center start_container">
    <div class="row">
        <div class="col-md-12 text-center">
            <h1 class="title fw-bold">Chat</h1>
        </div>
    </div>

    <div class="row mx-md-5">
        <div class="col-md-8 mb-2 mx-auto text-left">
            <div class="chat_container">
                <form [formGroup]="chatForm" (ngSubmit)="sendMessage()" class="chat_form">
                    <input type="text" formControlName="message" placeholder="Scrie un mesaj..." class="chat_input" />
                    <button type="submit" [disabled]="chatForm.invalid" class="chat_button">Trimite</button>
                </form>

                <div class="chat_messages">
                    <div *ngFor="let chat of chats" class="chat_message">
                        <strong>{{ chat.username }}</strong>
                        <span>{{ chat.message }}</span>&nbsp;
                        <small>{{ chat.sendAt | date:'short' }}</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row mx-md-5 justify-content-center">
        <div class="col-md-4">
            <button class="btn btn-warning btn-lg d-block w-100 fw-bold" style="color: white;" (click)="refreshChat()">
                Refresh
            </button>
        </div>
        <div class="col-md-4">
            <button class="btn btn-danger btn-lg d-block w-100 fw-bold" (click)="goToGamesPage()">
                Back
            </button>
        </div>
    </div>
</div>
